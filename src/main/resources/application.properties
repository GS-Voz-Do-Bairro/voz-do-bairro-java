# =====================================================================
# Voz do Bairro - API Java (perfil padrao: Oracle)
# Nenhum segredo neste arquivo: tudo vem de variaveis de ambiente.
# =====================================================================
spring.application.name=voz-do-bairro-java
server.port=${PORT:8080}

# ---------- Banco (PostgreSQL do Render) - schema e dados de teste vem de schema.sql e data.sql ----------
# Use DB_URL pronta ou monte a URL com DB_HOST, DB_PORT (padrao 5432) e DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Nomes de tabela/coluna em MAIUSCULAS e entre aspas (iguais aos usados pela API .NET).
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Sem isto o Spring Boot converteria "VB_PROPOSTA" para minusculas; aqui o nome fica exatamente como no @Table/@Column.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Roda schema.sql (CREATE TABLE IF NOT EXISTS) e data.sql (seed idempotente) a cada subida. Nos testes: never.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- JWT (compartilhado com a API .NET) ----------
vozdobairro.jwt.secret=${JWT_SECRET}
vozdobairro.jwt.issuer=voz-do-bairro
vozdobairro.jwt.expiracao=2h

# ---------- CORS (app Mobile) ----------
vozdobairro.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---------- RabbitMQ ----------
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
# A saude da API nao depende do broker (publicacao falha so gera log).
management.health.rabbit.enabled=false

# ---------- Agendador de prazos vencidos ----------
vozdobairro.agendador.habilitado=true
vozdobairro.agendador.prazo-cron=${PRAZO_CRON:0 */10 * * * *}

# ---------- Spring AI (qualquer API compativel com OpenAI) ----------
# "sem-chave" e um placeholder: o autoconfigure do Spring AI exige um valor nao vazio para subir.
# O IaService detecta o placeholder e usa o fallback local (a API funciona sem LLM).
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3
# So usamos chat: desliga os demais modelos do starter.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Poucas tentativas para nao segurar a requisicao quando o provedor falha.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=40s
vozdobairro.ia.habilitada=${IA_HABILITADA:true}

# ---------- Paginacao ----------
spring.data.web.pageable.max-page-size=100

# ---------- OpenAPI / Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false
