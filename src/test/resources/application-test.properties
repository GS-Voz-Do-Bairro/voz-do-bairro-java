# Perfil de testes: H2 em modo Oracle, schema criado pelo Hibernate, sem Rabbit real, sem LLM.
spring.datasource.url=jdbc:h2:mem:vozdobairro-test;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Segredo apenas para testes (nao e usado em nenhum ambiente real).
vozdobairro.jwt.secret=segredo-somente-para-testes-automatizados-0123456789

# RabbitMQ: listeners nao sobem; o RabbitTemplate e mockado nos testes.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

vozdobairro.agendador.habilitado=false
vozdobairro.ia.habilitada=false
spring.ai.openai.api-key=sem-chave
# Sem RabbitAdmin nos testes: nada tenta declarar filas/exchange num broker inexistente.
spring.rabbitmq.dynamic=false
